<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="../css/login.css">
    <title>Verify Email</title>
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <h1>Verify Your Email</h1>
            <p class="auth-subtitle">We sent a 6-digit code to <strong id="userEmail"></strong></p>

            <form id="verifyForm">
                <label for="code">Verification Code</label>
                <input type="text" id="code" placeholder="Enter 6-digit code" maxlength="6" required>

                <button type="submit" class="btn-primary">Verify</button>
            </form>

            <div class="auth-row">
                <span>Didn't receive the code?</span>
                <a href="#" id="resendCode">Resend Code</a>
            </div>

            <p class="auth-switch"><a href="./login.html">Back to Login</a></p>
        </div>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/verify.js"></script>
</body>
</html>
