<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../css/reset.css">
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="../../css/admin.css">
    <title>Admin · Products</title>
</head>
<body>
    <header class="admin-header">
        <div class="admin-header-container">
            <span class="admin-logo">Foodie Admin</span>

            <nav class="admin-nav">
                <a href="./products.html" class="active">Products</a>
                <a href="./categories.html">Categories</a>
            </nav>

            <div class="admin-header-actions">
                <a href="../../index.html">View Site</a>
                <button class="btn-outline" id="logoutBtn" type="button">Logout</button>
            </div>
        </div>
    </header>

    <main class="admin-page">
        <div class="admin-page-header">
            <h1>Products</h1>
            <button class="btn-primary" id="addProductBtn" type="button">Add Product</button>
        </div>

        <div class="admin-table-wrap">
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>Image</th>
                        <th>Name</th>
                        <th>Price</th>
                        <th>Rating</th>
                        <th>Vegetarian</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="productsTableBody"></tbody>
            </table>
        </div>

        <div class="pagination">
            <button class="pagination-btn" id="prevPageBtn" type="button" disabled>‹ Previous</button>
            <button class="pagination-btn" id="nextPageBtn" type="button">Next ›</button>
        </div>
    </main>

    <div class="admin-panel-backdrop" id="productPanelBackdrop"></div>
    <aside class="admin-panel" id="productPanel">
        <div class="admin-panel-header">
            <h2 id="productPanelTitle">Add Product</h2>
            <button class="admin-panel-close-btn" id="productPanelCloseBtn" type="button" aria-label="Close">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <form class="admin-form" id="productForm">
            <input type="hidden" id="productId">

            <div>
                <label for="productName">Name</label>
                <input type="text" id="productName" required>
            </div>

            <div>
                <label for="productDescription">Description</label>
                <textarea id="productDescription" required></textarea>
            </div>

            <div>
                <label for="productCategory">Category</label>
                <select id="productCategory" required></select>
            </div>

            <div>
                <label for="productPrice">Price</label>
                <input type="number" id="productPrice" min="0" step="0.01" required>
            </div>

            <div>
                <label for="productSpiciness">Spiciness (0-5)</label>
                <input type="number" id="productSpiciness" min="0" max="5" step="1" required>
            </div>

            <div class="checkbox-row">
                <input type="checkbox" id="productVegetarian">
                <label for="productVegetarian">Vegetarian</label>
            </div>

            <div>
                <label for="productImage">Image URL</label>
                <input type="text" id="productImage" required>
            </div>

            <div>
                <label for="productMethod">Preparation Method</label>
                <textarea id="productMethod" required></textarea>
            </div>

            <div>
                <label for="productIngredients">Ingredients (one per line)</label>
                <textarea id="productIngredients" required></textarea>
            </div>

            <div class="admin-form-actions">
                <button type="submit" class="btn-primary">Save</button>
                <button type="button" class="btn-outline" id="productPanelCancelBtn">Cancel</button>
            </div>
        </form>
    </aside>

    <script src="../../js/config.js"></script>
    <script src="../../js/admin-guard.js"></script>
    <script src="../../js/admin-products.js"></script>
</body>
</html>
